<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer connected network nodes -->
  <circle cx="50" cy="50" r="38" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="2 3" />

  <!-- Connecting network links -->
  <line x1="50" y1="26" x2="32" y2="60" stroke="#7A1E3A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="26" x2="68" y2="60" stroke="#1E5E3A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="60" x2="68" y2="60" stroke="#7A1E3A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Outer node dots -->
  <circle cx="50" cy="14" r="3.5" fill="#1E5E3A" />
  <circle cx="75" cy="28" r="3.5" fill="#7A1E3A" />
  <circle cx="82" cy="55" r="3" fill="#1E5E3A" />
  <circle cx="68" cy="80" r="3.5" fill="#7A1E3A" />
  <circle cx="32" cy="80" r="3.5" fill="#1E5E3A" />
  <circle cx="18" cy="55" r="3" fill="#7A1E3A" />
  <circle cx="25" cy="28" r="3.5" fill="#1E5E3A" />

  <!-- Top Person (Burgundy) -->
  <circle cx="50" cy="25" r="5.5" fill="#7A1E3A" />
  <path d="M42 41 C42 34 58 34 58 41 Z" fill="#7A1E3A" />

  <!-- Bottom Left Person (Green) -->
